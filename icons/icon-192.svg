<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="192" height="192">
  <defs>
    <linearGradient id="bg192" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFE1EC"/>
      <stop offset="1" stop-color="#F4A6B7"/>
    </linearGradient>
    <linearGradient id="horn192" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF2C2"/>
      <stop offset="1" stop-color="#F7C8A1"/>
    </linearGradient>
    <radialGradient id="cheek192" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FF8FB1" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FF8FB1" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg192)"/>
  <!-- mane wisps -->
  <path d="M120 300 q40 -90 90 -100 q-10 40 0 80 q10 -50 50 -70 q-5 40 5 70 q15 -40 55 -55 q-5 35 5 65 q20 -30 50 -45 q-10 60 -30 110 z" fill="#FFB4D1" opacity="0.95"/>
  <!-- head -->
  <ellipse cx="266" cy="298" rx="118" ry="106" fill="#FFFFFF"/>
  <!-- snout -->
  <ellipse cx="266" cy="350" rx="78" ry="58" fill="#FFF5F8"/>
  <!-- horn -->
  <path d="M266 110 L250 220 L282 220 Z" fill="url(#horn192)" stroke="#E9A06A" stroke-width="3" stroke-linejoin="round"/>
  <path d="M266 130 L262 220 M266 150 L270 220" stroke="#E9A06A" stroke-width="2" fill="none" opacity="0.5"/>
  <!-- ears -->
  <path d="M178 200 q-10 -50 20 -70 q20 30 18 70 z" fill="#FFFFFF"/>
  <path d="M354 200 q10 -50 -20 -70 q-20 30 -18 70 z" fill="#FFFFFF"/>
  <path d="M188 200 q-4 -28 12 -48" fill="#FFC8DC"/>
  <path d="M344 200 q4 -28 -12 -48" fill="#FFC8DC"/>
  <!-- cheeks -->
  <circle cx="200" cy="340" r="28" fill="url(#cheek192)"/>
  <circle cx="332" cy="340" r="28" fill="url(#cheek192)"/>
  <!-- closed-content eyes -->
  <path d="M210 300 q14 14 28 0" stroke="#3B2A33" stroke-width="6" stroke-linecap="round" fill="none"/>
  <path d="M304 300 q14 14 28 0" stroke="#3B2A33" stroke-width="6" stroke-linecap="round" fill="none"/>
  <!-- lashes -->
  <path d="M212 296 l-6 -10 M222 290 l-3 -12 M232 290 l3 -12" stroke="#3B2A33" stroke-width="3" stroke-linecap="round"/>
  <path d="M306 296 l-3 -12 M316 290 l3 -12 M326 290 l6 -10" stroke="#3B2A33" stroke-width="3" stroke-linecap="round"/>
  <!-- mouth -->
  <path d="M252 372 q14 12 28 0" stroke="#3B2A33" stroke-width="5" stroke-linecap="round" fill="none"/>
  <!-- sparkle -->
  <g fill="#FFD9E6">
    <path d="M408 130 l6 14 l14 6 l-14 6 l-6 14 l-6 -14 l-14 -6 l14 -6 z"/>
    <path d="M88 420 l4 9 l9 4 l-9 4 l-4 9 l-4 -9 l-9 -4 l9 -4 z"/>
  </g>
</svg>
